<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özel Poker Kulübü</title>

<style>
:root{
  --gold:#f5c46b;
  --purple:#6a1b9a;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a0033, #000);
  color:#fff;
  text-align:center;
}

.container{
  padding:50px 20px;
  max-width:420px;
  margin:auto;
}

h1{
  color:var(--gold);
}

.card{
  background:rgba(255,255,255,.06);
  border-radius:18px;
  padding:25px;
  margin-top:30px;
}

.item{
  margin:12px 0;
}

.button{
  display:block;
  margin-top:30px;
  padding:16px;
  background:linear-gradient(135deg,var(--gold),#ffdd9a);
  color:#000;
  text-decoration:none;
  font-weight:bold;
  border-radius:14px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Türkiye Özel Poker Kulübü</h1>

  <div class="card">
    <div class="item">🔥 %50 Rakeback Sizin</div>
    <div class="item">🕒 7/24 Aktif Masalar</div>
    <div class="item">🕶️ %100 Anonim</div>
    <div class="item">👑 VIP Destek</div>
  </div>

  <a class="button" href="https://t.me/+-zx9-viOsXozZTY0">
    Telegram’a Katıl
  </a>
</div>
</body>
</html>
