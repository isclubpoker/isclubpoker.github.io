<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Poker Kulübü</title>

<style>
:root{
  --gold:#f5c46b;
  --gold2:#ffe1a6;
  --green:#0b3d2e;
  --dark:#020403;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',system-ui;
  color:#fff;
  background:
    radial-gradient(circle at center, rgba(0,0,0,.4), #000),
    linear-gradient(135deg, #052e1f, #02150f);
  overflow:hidden;
}

/* Poker table texture feel */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,.5), transparent 45%);
  opacity:.8;
}

/* Soft entrance */
.container{
  position:relative;
  max-width:420px;
  margin:auto;
  padding:60px 20px;
  text-align:center;
  animation:softIn 1.8s ease forwards;
}

@keyframes softIn{
  from{opacity:0; transform:translateY(25px)}
  to{opacity:1; transform:translateY(0)}
}

/* Badge */
.badge{
  display:inline-block;
  padding:7px 18px;
  border-radius:30px;
  font-size:12px;
  letter-spacing:2px;
  color:var(--gold);
  background:rgba(0,0,0,.55);
  box-shadow:0 0 25px rgba(245,196,107,.25);
  margin-bottom:30px;
}

/* Title */
h1{
  font-size:32px;
  margin-bottom:10px;
  background:linear-gradient(135deg,var(--gold),#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  opacity:.85;
  margin-bottom:40px;
  font-size:15px;
}

/* VIP Card */
.card{
  background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(0,0,0,.45));
  border:1px solid rgba(255,255,255,.15);
  border-radius:26px;
  padding:30px 22px;
  backdrop-filter:blur(14px);
  box-shadow:0 30px 60px rgba(0,0,0,.7);
  transform-style:preserve-3d;
  animation:vipFloat 4s ease-in-out infinite;
}

@keyframes vipFloat{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

.card:hover{
  transform:rotateX(6deg) rotateY(-6deg) scale(1.02);
  transition:.6s ease;
}

.item{
  margin:14px 0;
  font-size:16px;
}

.gold{color:var(--gold); font-weight:800}

/* CTA */
.button{
  display:block;
  margin-top:45px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
  text-decoration:none;
  font-weight:900;
  font-size:18px;
  box-shadow:0 0 25px rgba(245,196,107,.7);
  animation:glowPulse 1.7s infinite;
}

@keyframes glowPulse{
  0%{box-shadow:0 0 0 0 rgba(245,196,107,.7)}
  70%{box-shadow:0 0 0 20px rgba(245,196,107,0)}
  100%{box-shadow:0 0 0 0 rgba(245,196,107,0)}
}

/* Countdown */
.countdown{
  margin-top:22px;
  font-size:13px;
  opacity:.75;
}

/* Footer */
.footer{
  margin-top:26px;
  font-size:12px;
  opacity:.55;
}

/* Ambient glow */
.glow{
  position:absolute;
  width:320px;
  height:320px;
  background:#1a7f5a;
  filter:blur(140px);
  top:-90px;
  left:50%;
  transform:translateX(-50%);
  opacity:.45;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <div class="badge">VIP • PRIVATE • INVITE ONLY</div>

  <h1>Özel Poker Kulübü</h1>
  <div class="subtitle">
    Profesyonel masalar • Güvenli ortam • Telegram erişimi
  </div>

  <div class="card">
    <div class="item">🔥 <span class="gold">%50 Rakeback Sizin</span></div>
    <div class="item">🃏 Yüksek limit VIP masalar</div>
    <div class="item">🕒 7/24 aktif oyun</div>
    <div class="item">🕶️ %100 anonim</div>
    <div class="item">📲 Telegram üzerinden giriş</div>
  </div>

  <a class="button" href="https://t.me/+-zx9-viOsXozZTY0">
    Telegram’a Katıl
  </a>

  <div class="countdown">
    Otomatik yönlendirme: <span id="timer">13</span> saniye
  </div>

  <div class="footer">
    Davetiye ile giriş • Sorumlu oyun
  </div>

</div>

<script>
let time = 13;
const t = document.getElementById("timer");

const interval = setInterval(()=>{
  time--;
  t.textContent = time;
  if(time <= 0){
    clearInterval(interval);
    window.location.href = "https://t.me/+-zx9-viOsXozZTY0";
  }
},1000);
</script>

</body>
</html>
